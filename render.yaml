services:
  - type: web
    name: municipios-br-clustering-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT --app-dir .
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
    healthCheckPath: /health
